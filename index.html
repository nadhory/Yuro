<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuro Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-primary: #0D1117;
            --bg-secondary: #161B22;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #E6EDF3;
            --accent-glow: 0 0 15px rgba(29, 185, 195, 0.6);
            --accent-color: #1DB9C3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glow {
            0% { text-shadow: 0 0 5px var(--accent-color); }
            50% { text-shadow: 0 0 20px var(--accent-color); }
            100% { text-shadow: 0 0 5px var(--accent-color); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        
        .bot-response-content strong { color: var(--accent-color); }
        .bot-response-content ul, .bot-response-content ol { padding-left: 20px; margin: 8px 0; }
        .bot-response-content li { margin-bottom: 4px; }
        .bot-response-content a { color: #60a5fa; text-decoration: underline; }
        .bot-response-content pre { background-color: var(--bg-primary); border-radius: 8px; padding: 1rem; margin: 1rem 0; white-space: pre-wrap; border: 1px solid var(--border-color);}
        .bot-response-content code { font-family: 'Courier New', Courier, monospace; font-size: 0.9em; border-radius: 4px; }
        .bot-response-content pre code { padding: 0; background: transparent; }
        .bot-response-content p > code { background-color: var(--bg-secondary); padding: 2px 6px; }

        #splash-screen { background: radial-gradient(circle, #1e2835 0%, #0D1117 100%); }
        .splash-title { animation: glow 3s ease-in-out infinite; }

        #app-container { opacity: 0; pointer-events: none; transition: opacity 0.8s ease-in-out; }
        #app-container.visible { opacity: 1; pointer-events: auto; }
        .glass-effect { background: rgba(22, 27, 34, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border-color); }
        
        #sun-effect {
            background: radial-gradient(circle, rgba(255,253,224,1) 0%, rgba(255,223,130,0.8) 30%, rgba(251,192,45,0.4) 60%, rgba(251,192,45,0) 70%);
        }
        .animate-sunburst { animation: sunburst 0.8s ease-in-out forwards; }
        @keyframes sunburst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(350); opacity: 0; }
        }

        .interactive-button { transition: all 0.3s ease; }
        .interactive-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(29, 185, 195, 0.7);
        }
        .chat-history-item:not(.active-chat):hover {
            transform: translateX(5px);
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="sun-effect" class="fixed top-1/2 left-1/2 w-1 h-1 rounded-full pointer-events-none z-[60] transform -translate-x-1/2 -translate-y-1/2 scale-0"></div>

    <div id="splash-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="text-center animate-fade-in p-4">
            <svg class="w-16 h-16 text-[var(--accent-color)] mx-auto mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></svg>
            <h1 class="text-4xl sm:text-5xl font-bold mb-2 splash-title">Yuro Chatbot</h1>
            <p class="text-lg text-gray-400 mb-8">Enter your Google Gemini API Key to begin.</p>
            <div class="w-full max-w-md mx-auto flex flex-col sm:flex-row gap-2">
                <input type="password" id="api-key-input" placeholder="Your API Key" class="w-full bg-transparent border-2 border-[var(--border-color)] rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-[var(--accent-color)] focus:border-[var(--accent-color)] transition-all">
                <button id="save-api-key" class="bg-[var(--accent-color)] hover:bg-opacity-90 text-black font-bold py-3 px-6 rounded-lg interactive-button shrink-0">
                    Connect
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="relative h-screen w-screen flex">
        
        <!-- Sidebar Overlay (for mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

        <!-- Sidebar -->
        <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-gradient-to-b from-[var(--bg-secondary)] to-[var(--bg-primary)] flex flex-col p-4 overflow-y-auto border-r border-[var(--border-color)] z-40 transform -translate-x-full lg:relative lg:translate-x-0 transition-transform duration-300 ease-in-out">
            <h2 class="text-2xl font-bold mb-4 text-white">Chat History</h2>
            <button id="new-chat-button" class="w-full bg-[var(--accent-color)] hover:bg-opacity-90 text-black font-bold py-2 px-4 rounded-lg mb-4 interactive-button flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                New Chat
            </button>
            <div id="chat-history-container" class="space-y-2"></div>
        </div>

        <!-- Main Chat UI -->
        <div id="chatbot-ui" class="flex-1 flex flex-col bg-[var(--bg-primary)] h-screen">
            <header class="p-4 glass-effect flex items-center justify-between border-b border-[var(--border-color)]">
                <div class="flex items-center gap-3">
                    <!-- Hamburger Menu Button (Mobile Only) -->
                    <button id="menu-toggle-button" class="p-2 rounded-md hover:bg-white/10 lg:hidden">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <svg class="w-8 h-8 text-[var(--accent-color)] hidden sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></svg>
                    <h1 class="text-xl font-bold text-white">Yuro Chatbot ✨</h1>
                </div>
            </header>

            <main id="chat-container" class="flex-1 p-4 sm:p-6 space-y-6 overflow-y-auto"></main>

            <footer class="p-4 glass-effect border-t border-[var(--border-color)]">
                <div class="flex items-center bg-[var(--bg-secondary)] rounded-xl p-2 gap-2 border border-[var(--border-color)]">
                    <input type="text" id="user-input" placeholder="Ask me anything..." class="flex-1 bg-transparent border-none text-white placeholder-gray-500 focus:ring-0 px-3">
                    <button id="inspire-button" title="✨ Inspire Me" class="p-2 rounded-lg hover:bg-white/10 transition-all duration-300 hover:scale-110 hover:rotate-12">
                         <svg class="w-6 h-6 text-[var(--accent-color)]" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.5L12 2l2.5 5.5L20 8l-5.5 2.5L12 16l-2.5-5.5L4 8l5.5-1.5z"/><path d="M4 21l3-3"/><path d="M17 21l3-3"/><path d="M21 4l-3 3"/><path d="M21 17l-3 3"/><path d="M3 4l3 3"/></svg>
                    </button>
                    <button id="send-button" class="bg-[var(--accent-color)] hover:bg-opacity-90 text-black font-semibold py-2 px-4 rounded-lg flex items-center gap-2 interactive-button">
                        Send
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <!-- Modals -->
    <div id="confirm-delete-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 transition-opacity duration-300 opacity-0 pointer-events-none p-4">
        <div class="glass-effect p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-sm text-center transform transition-transform duration-300 scale-95">
            <h2 class="text-2xl font-bold mb-4 text-red-400">Delete Chat</h2>
            <p class="text-gray-300 mb-6">Are you sure? This action cannot be undone.</p>
            <div class="flex gap-4">
                 <button id="cancel-delete" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Cancel</button>
                <button id="confirm-delete" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Delete</button>
            </div>
        </div>
    </div>
    
    <script>
        // DOM Elements
        const splashScreen = document.getElementById('splash-screen');
        const sunEffect = document.getElementById('sun-effect');
        const appContainer = document.getElementById('app-container');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const inspireButton = document.getElementById('inspire-button');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveApiKeyButton = document.getElementById('save-api-key');
        const newChatButton = document.getElementById('new-chat-button');
        const chatHistoryContainer = document.getElementById('chat-history-container');
        const confirmDeleteModal = document.getElementById('confirm-delete-modal');
        const confirmDeleteButton = document.getElementById('confirm-delete');
        const cancelDeleteButton = document.getElementById('cancel-delete');
        // Responsive Elements
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const menuToggleButton = document.getElementById('menu-toggle-button');

        // State
        let geminiApiKey = "";
        let chatHistory = [];
        let allChats = [];
        let activeChatId = null;
        let isTyping = false;
        let chatToDeleteId = null;

        const inspirationalPrompts = [
            "Explain the theory of relativity in a simple, elegant way.",
            "Write a short story about a city that runs on music.",
            "What are some groundbreaking applications of AI in medicine?",
            "Compose a haiku about the silence of a forest.",
            "If you could design a new planet, what would it be like?"
        ];

        // --- Data Persistence ---
        const saveChats = () => localStorage.setItem('yuro-chats', JSON.stringify(allChats));
        const loadChats = () => JSON.parse(localStorage.getItem('yuro-chats') || '[]');

        // --- Responsive Sidebar Logic ---
        const toggleSidebar = () => {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        };

        // --- UI Rendering ---
        const renderChatHistory = () => {
            chatHistoryContainer.innerHTML = '';
            allChats.forEach(chat => {
                const isActive = chat.id === activeChatId;
                const item = document.createElement('div');
                item.className = `chat-history-item group relative flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all duration-200 ${isActive ? 'bg-[var(--accent-color)] text-black font-semibold active-chat' : ''}`;
                item.innerHTML = `<span class="truncate pr-8">${chat.title}</span>`;
                item.addEventListener('click', () => {
                    if(activeChatId !== chat.id) {
                        activeChatId = chat.id;
                        loadChat(chat.id);
                        renderChatHistory();
                    }
                    // Close sidebar on mobile after selection
                    if (window.innerWidth < 1024) {
                        toggleSidebar();
                    }
                });
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = `absolute right-2 p-1 rounded-full ${isActive ? 'text-black hover:bg-black/20' : 'text-gray-400 hover:bg-white/20 opacity-0 group-hover:opacity-100'} transition-all hover:scale-125 hover:text-[var(--accent-color)]`;
                deleteBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                deleteBtn.onclick = (e) => { e.stopPropagation(); showDeleteModal(chat.id); };
                
                item.appendChild(deleteBtn);
                chatHistoryContainer.appendChild(item);
            });
        };

        // --- Chat Management ---
        const createNewChat = () => {
            const newChat = { id: Date.now(), title: 'New Conversation', history: [] };
            allChats.unshift(newChat);
            activeChatId = newChat.id;
            saveChats();
            loadChat(activeChatId);
            renderChatHistory();
             if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        };
        
        const loadChat = (chatId) => {
            const chat = allChats.find(c => c.id === chatId);
            if (!chat) return;
            chatHistory = chat.history;
            chatContainer.innerHTML = '';
            if (chatHistory.length === 0) {
                 addBotMessage("Hello! I'm Yuro. How can I assist you today?", false, false);
            } else {
                chatHistory.forEach(msg => {
                    if (msg.role === 'user') addUserMessage(msg.parts[0].text, false);
                    else addBotMessage(msg.parts[0].text, false, false);
                });
            }
        };

        const handleSendMessage = async () => {
            if (isTyping) return;
            const message = userInput.value.trim();
            if (message) {
                userInput.value = '';
                addUserMessage(message);
                const currentChat = allChats.find(c => c.id === activeChatId);
                if (currentChat && currentChat.title === 'New Conversation') {
                    currentChat.title = message.substring(0, 40) + (message.length > 40 ? '...' : '');
                    renderChatHistory();
                }
                await callGeminiApi();
            }
        };

        // --- API Call ---
        const callGeminiApi = async () => {
            showTypingIndicator();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory.filter(c => c.parts[0].text) }),
                });
                if (!response.ok) throw new Error(`API Error: ${response.status} ${response.statusText}`);
                const data = await response.json();
                const botResponse = data.candidates[0].content.parts[0].text;
                addBotMessage(botResponse);
            } catch (error) {
                console.error('Error:', error);
                addBotMessage('Sorry, something went wrong. Please check your API key or console for errors.', false, true);
            }
        };

        // --- Message Display ---
        const addUserMessage = (message, save = true) => {
            if (save) {
                chatHistory.push({ role: 'user', parts: [{ text: message }] });
                saveChats();
            }
            const el = document.createElement('div');
            el.className = 'chat-message flex justify-end animate-fade-in';
            el.innerHTML = `<div class="bg-gradient-to-br from-[var(--accent-color)] to-[#15a3ad] text-black rounded-xl p-3 sm:p-4 max-w-[80%] sm:max-w-lg shadow-lg"><p>${message}</p></div>`;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        const addBotMessage = (message, save = true, type = true) => {
            if (save) {
                chatHistory.push({ role: 'model', parts: [{ text: message }] });
                saveChats();
            }

            const typingIndicator = document.getElementById('typing-indicator');
            let contentContainer;

            if (typingIndicator && type) {
                contentContainer = typingIndicator.querySelector('.bot-response-content');
                typingIndicator.removeAttribute('id');
            } else {
                const msgId = `bot-msg-${Date.now()}`;
                const el = document.createElement('div');
                el.className = 'chat-message flex animate-fade-in';
                el.innerHTML = `
                    <div class="flex-shrink-0 mr-3"><div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-[var(--accent-color)] border border-white/20">Y</div></div>
                    <div class="bg-[var(--bg-secondary)] rounded-xl p-3 sm:p-4 max-w-[80%] sm:max-w-lg border border-[var(--border-color)]">
                        <div id="${msgId}" class="bot-response-content"></div>
                    </div>`;
                chatContainer.appendChild(el);
                contentContainer = document.getElementById(msgId);
            }

            if (type) {
                typewriterEffect(contentContainer, message);
            } else {
                contentContainer.innerHTML = marked.parse(message);
                contentContainer.querySelectorAll('pre code').forEach(hljs.highlightElement);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };
        
        const typewriterEffect = (element, text) => {
            let i = 0;
            isTyping = true;
            element.innerHTML = "";

            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    setTimeout(type, 10);
                } else {
                    isTyping = false;
                    element.innerHTML = marked.parse(text);
                    element.querySelectorAll('pre code').forEach(hljs.highlightElement);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }
            type();
        };

        const showTypingIndicator = () => {
            if (document.getElementById('typing-indicator')) return;
            const el = document.createElement('div');
            el.id = 'typing-indicator';
            el.className = 'chat-message flex animate-fade-in';
            el.innerHTML = `
                <div class="flex-shrink-0 mr-3"><div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-[var(--accent-color)] border border-white/20">Y</div></div>
                <div class="bg-[var(--bg-secondary)] rounded-xl p-3 sm:p-4 max-w-lg border border-[var(--border-color)]">
                    <div class="bot-response-content">
                        <p class="animate-pulse text-gray-400">typing...</p>
                    </div>
                </div>`;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        // --- Modals ---
        const showDeleteModal = (chatId) => {
            chatToDeleteId = chatId;
            confirmDeleteModal.classList.remove('opacity-0', 'pointer-events-none');
            confirmDeleteModal.querySelector('div').classList.remove('scale-95');
        };

        const hideDeleteModal = () => {
            confirmDeleteModal.classList.add('opacity-0', 'pointer-events-none');
            confirmDeleteModal.querySelector('div').classList.add('scale-95');
            chatToDeleteId = null;
        };

        const handleDeleteChat = () => {
            if (!chatToDeleteId) return;
            allChats = allChats.filter(c => c.id !== chatToDeleteId);
            saveChats();
            if (activeChatId === chatToDeleteId) {
                activeChatId = allChats.length > 0 ? allChats[0].id : null;
                if (activeChatId) loadChat(activeChatId); else createNewChat();
            }
            renderChatHistory();
            hideDeleteModal();
        };

        // --- Initialization ---
        const connectWithApiKey = () => {
            const key = apiKeyInput.value.trim();
            if (!key) return;
            geminiApiKey = key;

            sunEffect.classList.add('animate-sunburst');
            sunEffect.addEventListener('animationend', () => {
                splashScreen.style.display = 'none';
                appContainer.classList.add('visible');
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
                
                allChats = loadChats();
                if (allChats.length === 0) createNewChat();
                else {
                    activeChatId = allChats[0].id;
                    loadChat(activeChatId);
                }
                renderChatHistory();
            }, { once: true });
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            userInput.disabled = true;
            sendButton.disabled = true;
            
            saveApiKeyButton.addEventListener('click', connectWithApiKey);
            apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') connectWithApiKey(); });
            newChatButton.addEventListener('click', createNewChat);
            inspireButton.addEventListener('click', () => {
                userInput.value = inspirationalPrompts[Math.floor(Math.random() * inspirationalPrompts.length)];
                userInput.focus();
            });
            sendButton.addEventListener('click', handleSendMessage);
            userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } });
            confirmDeleteButton.addEventListener('click', handleDeleteChat);
            cancelDeleteButton.addEventListener('click', hideDeleteModal);
            // Responsive Listeners
            menuToggleButton.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
        });
    </script>
</body>
</html>
